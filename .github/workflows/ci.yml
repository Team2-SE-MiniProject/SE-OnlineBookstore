name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        run: flake8 . --select=E9,F63,F7,F82 --exclude=venv,migrations

      - name: Run tests
        run: python manage.py test

#a few notes on what this does: 
#this workflow is triggered on push and pull request events to the main branch.
#lint only fails on real errors (syntax errors, undefined names). 
#a stricter style check would fail on Django’s auto-generated files, which have unused imports.
#tests use Django’s built-in runner, so it passes today with 0 tests. 
#when we add tests, they run automatically. 
#we can switch to pytest later by adding pytest-django.
#so far, this workflow is a good start to ensure that our code is syntactically correct and that our tests pass.