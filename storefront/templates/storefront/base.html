{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Online Bookstore{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'storefront/style.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{% url 'storefront:books' %}">Online Bookstore</a>
      <nav aria-label="Main">
        <a href="{% url 'storefront:books' %}">Books</a>
        {% block nav_extra %}{% endblock %}
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">Software Engineering Mini Project</div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
