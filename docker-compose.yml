# Starts the whole project with one command:  docker compose up --build
# Open http://localhost:8000 when the web service is ready.
# Emails and SMS (printed by default) appear in:  docker compose logs -f worker

x-app: &app
  build: .
  environment:
    SECRET_KEY: ${SECRET_KEY:-docker-demo-secret-key-change-me-0123456789abcdef}
    DB_ENGINE: django.db.backends.postgresql
    DB_NAME: online_bookstore
    DB_USER: bookstore
    DB_PASSWORD: bookstore
    DB_HOST: db
    DB_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    # Email and SMS: the defaults print messages in the worker log.
    # To change them, put the same names in a .env file next to this file.
    EMAIL_BACKEND: ${EMAIL_BACKEND:-notifications.backends.ReadableConsoleEmailBackend}
    EMAIL_HOST: ${EMAIL_HOST:-localhost}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@onlinebookstore.local}
    SMS_BACKEND: ${SMS_BACKEND:-notifications.sms.ConsoleSMSBackend}
    SMS_DEFAULT_COUNTRY_CODE: ${SMS_DEFAULT_COUNTRY_CODE:-+91}
    TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
    TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: online_bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d online_bookstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    command: sh -c "python manage.py migrate && python manage.py seed_books && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A bookstore worker -l info

volumes:
  pgdata: